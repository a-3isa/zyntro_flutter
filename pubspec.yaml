name: zyntro_flutter
description: "Zyntro - Workout buddy app migrated from React Native"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.9.0
  firebase_app_check: ^0.3.2+10
  firebase_auth: ^5.5.1
  flutter_facebook_auth: ^7.1.1
  cloud_firestore: ^5.6.2
  firebase_storage: ^12.4.2
  
  # Navigation
  go_router: ^14.8.1
  
  # State Management
  flutter_riverpod: ^2.6.1
  
  # UI Components
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  
  # Media
  image_picker: ^1.1.2
  
  # Utilities
  flutter_dotenv: ^5.2.1
  intl: ^0.20.2
  uuid: ^4.5.1
  timeago: ^3.7.0
  path_provider: ^2.1.5
  http: ^1.2.0
  
  # Charts (for RecapScreen)
  fl_chart: ^0.70.2
  
  # Audio Recording & Playback
  record: ^5.2.0
  audioplayers: ^6.1.0
  
  # Offline & Connectivity
  connectivity_plus: ^6.1.0
  shared_preferences: ^2.3.3
  
  # Push Notifications
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1
  package_info_plus: ^8.1.2
  
  # Payments
  flutter_stripe: ^11.3.0
  
  # Content Filtering
  profanity_filter: ^2.0.0
  
  # Stream utilities for debouncing
  rxdart: ^0.28.0
  google_sign_in: ^6.2.1
  flutter_image_compress: ^2.4.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.10+1
  avatar_plus: ^0.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.2

dependency_overrides:
  record_linux: ^1.2.0

# App icon configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21

# Splash screen configuration
flutter_native_splash:
  color: "#0A0E1A"
  image: assets/splash_z_v5.png
  android: true
  ios: true
  android_12:
    color: "#0A0E1A"
    image: assets/splash_z_v5.png
    icon_background_color: "#0A0E1A"

flutter:
  uses-material-design: true
  
  assets:
    - .env
    - .env.dev
    - .env.staging
    - .env.prod
    - assets/
