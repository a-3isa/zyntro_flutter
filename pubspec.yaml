name: zyntro_flutter
description: "Zyntro - Workout buddy app migrated from React Native"
publish_to: 'none'
version: 1.0.1+6

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: 4.11.0
  firebase_app_check: 0.4.5
  firebase_auth: 6.5.4
  flutter_facebook_auth: ^7.1.1
  cloud_firestore: 6.6.0
  firebase_storage: 13.4.3
  firebase_analytics: 12.4.3
  firebase_crashlytics: ^5.2.4
  
  # Navigation
  go_router: 17.3.0
  
  # State Management
  flutter_riverpod: 3.3.2
  
  # UI Components
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  confetti: 0.8.0
  flutter_cache_manager: ^3.4.1
  
  # Media
  image_picker: ^1.1.2
  
  # Utilities
  flutter_dotenv: 6.0.1
  intl: ^0.20.2
  uuid: ^4.5.1
  timeago: ^3.7.0
  path_provider: ^2.1.5
  http: ^1.2.0
  
  # Charts (for RecapScreen)
  fl_chart: 1.2.0
  
  # Audio Recording & Playback
  record: 7.1.0
  audioplayers: 6.8.1
  
  # Offline & Connectivity
  connectivity_plus: 7.2.0
  shared_preferences: ^2.3.3
  
  # Push Notifications
  firebase_messaging: 16.4.1
  flutter_local_notifications: 22.0.1
  package_info_plus: 10.2.0
  
  # Payments
  
  # Content Filtering
  profanity_filter: ^2.0.0
  
  # Stream utilities for debouncing
  rxdart: ^0.28.0
  google_sign_in: 7.2.0
  flutter_image_compress: ^2.4.0
  google_fonts: 8.1.0
  flutter_svg: ^2.0.10+1


dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  fake_cloud_firestore: ^4.1.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: 2.4.8

# App icon configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "design/app_icon.png"
  min_sdk_android: 21

# Splash screen configuration
flutter_native_splash:
  background_image: design/splash_background.png
  image: design/splash_z_v5.png
  android: true
  ios: true
  android_min_sdk: 21
  android_12:
    color: "#0A0E1A"
    image: design/splash_z_v5.png
    icon_background_color: "#0A0E1A"

flutter:
  uses-material-design: true
  # Generates lib/l10n/app_localizations.dart from lib/l10n/*.arb
  generate: true
  
  # Only runtime-loaded assets belong here. Splash and launcher-icon source
  # art lives in design/ — flutter_native_splash and flutter_launcher_icons
  # read it at generation time and bake it into native resources, so bundling
  # it would ship ~1.9 MB the app never loads.
  assets:
    - assets/sounds/turn_start.wav
