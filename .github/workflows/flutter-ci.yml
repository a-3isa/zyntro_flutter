# Quality-gate source of truth — see docs/CI.md (Z-CI-002).
name: Flutter CI/CD

on:
  push:
    branches:
      - main
      - dev
      - staging
      - "001-clean-architecture-migration"
      - "007-resume-active-session"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze & Test
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Accessibility guideline smoke (Z-A11Y-005)
        run: flutter test test/a11y/guideline_smoke_test.dart

      - name: Enforce coverage floor (Z-TEST-001)
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('coverage/lcov.info')
          assert p.exists(), 'coverage/lcov.info missing'
          lf = lh = 0
          for line in p.read_text(encoding='utf-8', errors='ignore').splitlines():
              if line.startswith('LF:'):
                  lf += int(line[3:])
              elif line.startswith('LH:'):
                  lh += int(line[3:])
          pct = (100.0 * lh / lf) if lf else 0.0
          print(f'Line coverage: {pct:.2f}% ({lh}/{lf})')
          # Floor matches the ~32% baseline from the audit; ratchet up later.
          assert pct >= 30.0, f'coverage {pct:.2f}% below 30% floor'
          PY

  functions-test:
    name: Cloud Functions Unit Tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions deps
        working-directory: functions
        run: npm ci

      - name: Run functions unit tests
        working-directory: functions
        run: npm test

  rules-test:
    name: Firestore Rules Emulator Tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Java (rules emulator)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          # firebase-tools needs Java 21 or later for the emulators.
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install rules test deps
        working-directory: test/rules
        run: npm ci

      - name: Run Firestore rules emulator tests
        working-directory: test/rules
        run: npm test

  # Z-TEST-005: device/emulator smoke — not a PR gate (see docs/TESTING.md).
  integration-smoke:
    name: Integration Smoke (manual)
    timeout-minutes: 45
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger
          sudo apt-get update
          sudo apt-get install -y bridge-utils

      - name: Run integration smoke on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          script: flutter test integration_test/smoke_test.dart

  release-config:
    name: Release Config
    timeout-minutes: 5
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      android: ${{ steps.check.outputs.android }}
      ios: ${{ steps.check.outputs.ios }}
      rules: ${{ steps.check.outputs.rules }}
    steps:
      # Release jobs need signing / deploy secrets. Skip a job with a visible
      # warning when its secrets are not configured, instead of failing main.
      - name: Check release secrets
        id: check
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          check() {
            if [ -n "$2" ]; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
              echo "::warning::$3 is not set; skipping the $1 release job"
            fi
          }
          check android "$KEYSTORE_BASE64" KEYSTORE_BASE64
          check ios "$IOS_CERTIFICATE_BASE64" IOS_CERTIFICATE_BASE64
          check rules "$FIREBASE_TOKEN" FIREBASE_TOKEN

  build-android:
    name: Build Android Release
    timeout-minutes: 45
    needs: [analyze, functions-test, rules-test, release-config]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.release-config.outputs.android == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=release.jks" >> android/key.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: >
          flutter build apk
          --dart-define=ENV=prod
          --dart-define=STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          --release
          --obfuscate
          --split-debug-info=build/app/outputs/symbols

      - name: Build App Bundle
        run: >
          flutter build appbundle
          --dart-define=ENV=prod
          --dart-define=STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          --release
          --obfuscate
          --split-debug-info=build/app/outputs/symbols

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-aab-release
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload Android debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-symbols
          path: build/app/outputs/symbols

  build-ios:
    name: Build iOS Release
    timeout-minutes: 60
    needs: [analyze, functions-test, rules-test, release-config]
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main' && needs.release-config.outputs.ios == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Install Apple Certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Install Provisioning Profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: >
          flutter build ios
          --dart-define=ENV=prod
          --dart-define=STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          --release
          --no-codesign
          --obfuscate
          --split-debug-info=build/ios/symbols

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-release
          path: build/ios/iphoneos/Runner.app

      - name: Upload iOS debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: ios-debug-symbols
          path: build/ios/symbols

  deploy-firebase-rules:
    name: Deploy Firebase Rules
    timeout-minutes: 10
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.release-config.outputs.rules == 'true'
    needs: [analyze, functions-test, rules-test, release-config]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore and Storage rules
        run: firebase deploy --only "firestore:rules,firestore:indexes,storage" --token ${{ secrets.FIREBASE_TOKEN }} --project ${{ secrets.FIREBASE_PROJECT_ID }}
