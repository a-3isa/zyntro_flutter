        - heading "Workouts don't die in the gym." [level=2] [ref=f6e101]
        - generic [ref=f6e102]:
          - generic [ref=f6e103]: 6:47pm
          - paragraph [ref=f6e104]: The moment most workouts actually end — on the couch, before they start. Zyntro exists for that moment.
      - generic [ref=f6e105]:
        - paragraph [ref=f6e106]: Skipping alone is easy. Nobody sees it. Nobody asks. Tomorrow becomes next week and next week becomes January.
        - paragraph [ref=f6e107]:
          - text: But when your friend is already warming up — when their timer is running on
          - emphasis [ref=f6e108]: your
          - text: screen and their voice note says
          - emphasis [ref=f6e109]: "\"you coming or what?\""
          - text: — skipping stops being an option.
        - paragraph [ref=f6e110]: Zyntro puts you in the same room even when you're miles apart. Not a feed you scroll later. Not a chart you check once. A live session, happening right now, with someone who's counting on you.
        - paragraph [ref=f6e111]: That's the whole idea. Accountability that feels like hanging out.
    - generic [ref=f6e113]:
