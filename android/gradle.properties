org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
android.enableJetifier=true

# R8 full mode: default in AGP 8+, set explicitly so it is never silently
# turned off. Required for Play Console to report real optimization scores.
android.enableR8.fullMode=true

# Disable Kotlin incremental compilation to fix cross-drive path issues on Windows
kotlin.incremental=false
kotlin.incremental.java=false
kotlin.caching.enabled=false

# Disable Kotlin daemon to prevent caching issues
kotlin.compiler.execution.strategy=in-process
# Use Flutter's built-in Kotlin support for the app module.
android.builtInKotlin=true
# Use Flutter's new Gradle plugin DSL path.
android.newDsl=true
